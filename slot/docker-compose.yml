version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: slot_postgres
    restart: always
    environment:
      POSTGRES_USER: slot_user
      POSTGRES_PASSWORD: slot_password
      POSTGRES_DB: slot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slot_user -d slot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: slot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: slot_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      API_PREFIX: api/v1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: slot_user
      DB_PASSWORD: slot_password
      DB_DATABASE: slot_db
      DB_SYNCHRONIZE: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super_secret_slot_jwt_key_2026
      JWT_EXPIRATION: 86400s
      JWT_REFRESH_SECRET: super_secret_slot_refresh_key_2026
      JWT_REFRESH_EXPIRATION: 604800s
      BOOKING_HOLD_SECONDS: 300
      OTP_PROVIDER: development
      DEV_DEFAULT_OTP: "123456"
      PAYMENT_MODE: pay_at_salon
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
