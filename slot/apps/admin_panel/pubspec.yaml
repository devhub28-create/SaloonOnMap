name: admin_panel
description: "SLOT Platform Admin Panel (Flutter Web)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  go_router: ^14.2.0
  dio: ^5.5.0
  shared_preferences: ^2.2.2
  design_system:
    path: ../../packages/design_system
  api_client:
    path: ../../packages/api_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

